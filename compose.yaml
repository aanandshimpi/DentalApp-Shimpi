services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: dentalcare
      POSTGRES_PASSWORD: dentalcare_local
      POSTGRES_DB: dentalcare
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dentalcare-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dentalcare -d dentalcare"]
      interval: 2s
      timeout: 3s
      retries: 15
volumes:
  dentalcare-db:
